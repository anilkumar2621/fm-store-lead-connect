<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Mobile Enquiry | FM STORE-STYLES</title>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
rel="stylesheet">

<link
rel="stylesheet"
href="style.css">

<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

<div id="app">

<div class="page active">

<div class="card">

<button
class="back-btn"
onclick="location.href='index.html'">

<i data-lucide="arrow-left"></i>

<span>Back</span>

</button>

<div style="text-align:center;margin-bottom:25px;">

<img
src="assets/logo.png"
alt="FM STORE-STYLES"
style="width:90px;margin-bottom:14px;">

<h1 class="title">

Mobile Enquiry

</h1>

<p class="subtitle">

Tell us the mobile you're looking for and we'll help you find the perfect one.

</p>

</div>

<form
id="mobileForm">

<div class="form-group">

<label>

Full Name

</label>

<input
type="text"
id="name"
class="form-control"
placeholder="Enter your full name"
required>

</div>

<div class="form-group">

<label>

Mobile Number

</label>

<input
type="tel"
id="mobile"
class="form-control"
placeholder="10 Digit Mobile Number"
maxlength="10"
required>

</div>

<div class="form-group">

<label>

Brand

</label>

<select
id="brand"
class="form-control"
required>

<option value="">Select Brand</option>

<option>Apple</option>

<option>Samsung</option>

<option>OnePlus</option>

<option>Google Pixel</option>

<option>Motorola</option>

<option>Nothing</option>

<option>Vivo</option>

<option>OPPO</option>

<option>Realme</option>

<option>Xiaomi</option>

<option>iQOO</option>

<option>Poco</option>

<option>Honor</option>

<option>Other</option>

</select>

</div>

<div
id="otherBrandGroup"
style="display:none;">

<div class="form-group">

<label>

Other Brand

</label>

<input
type="text"
id="otherBrand"
class="form-control"
placeholder="Enter Brand Name">

</div>

</div>

<div class="form-group">

<label>

Model

</label>

<input
type="text"
id="model"
class="form-control"
placeholder="Example: iPhone 15 Pro">

</div>

<div class="form-group">

<label>

Condition

</label>

<select
id="condition"
class="form-control">

<option>New</option>

<option>Pre-Owned</option>

<option>Either</option>

</select>

</div>

<div class="form-group">

<label>

Budget

</label>

<select
id="budget"
class="form-control">

<option>Below ₹15,000</option>

<option>₹15,000 – ₹25,000</option>

<option>₹25,000 – ₹40,000</option>

<option>₹40,000 – ₹60,000</option>

<option>Above ₹60,000</option>

</select>

</div>

<div class="form-group">

<label>

Preferred Color (Optional)

</label>

<input
type="text"
id="color"
class="form-control"
placeholder="Example: Black">

</div>
<div class="form-group">

<label>

RAM / Storage (Optional)

</label>

<input
type="text"
id="storage"
class="form-control"
placeholder="Example: 8GB / 256GB">

</div>

<div class="form-group">

<label>

Additional Requirements

</label>

<textarea
id="notes"
class="form-control"
placeholder="Mention colour, battery, exchange, EMI or any special requirement..."></textarea>

</div>

<button
type="submit"
class="btn">

<i data-lucide="search"></i>

&nbsp;

Find My Mobile

</button>

</form>

</div>

</div>

</div>

<script src="script.js"></script>

<script>

lucide.createIcons();

document
.getElementById("brand")
.addEventListener("change",function(){

document.getElementById("otherBrandGroup").style.display =
this.value==="Other"
? "block"
: "none";

});

document
.getElementById("mobileForm")
.addEventListener("submit",function(e){

e.preventDefault();

const btn=this.querySelector(".btn");

btn.disabled=true;

btn.innerHTML="Submitting...";

setTimeout(()=>{

window.location.href="thankyou.html";

},800);

});

</script>

</body>

</html>
